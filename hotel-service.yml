server:
  port: 9091

spring:
  application:
    name: hotel-service
  config:
    import: optional:configserver:http://localhost:8088
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: mySuperLongSecureJWTSecretKeyThatIsAtLeast32Chars
  logging:
    level:
      org.springframework.security: DEBUG

  datasource:
    url: jdbc:postgresql://sr-postgres:5432/hotel_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
