server:
  port: 9099

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://config-server:8088

  datasource:
    url: jdbc:postgresql://sr-postgres:5432/auth_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: mySuperLongSecureJWTSecretKeyThatIsAtLeast32Chars
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
