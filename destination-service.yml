server:
  port: 9093

spring:
  application:
    name: destination-service
  config:
    import: optional:configserver:http://config-server:8088
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: mySuperLongSecureJWTSecretKeyThatIsAtLeast32Chars

  datasource:
    url: jdbc:postgresql://postgres:5432/destination_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
