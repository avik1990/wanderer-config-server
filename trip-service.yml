server:
  port: 9095

spring:
  application:
    name: trip-service
  config:
    import: optional:configserver:http://config-server:8088

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: mySuperLongSecureJWTSecretKeyThatIsAtLeast32Chars

  datasource:
    url: jdbc:postgresql://sr-postgres:5432/trip_service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # options: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
    timeout: 100ms

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
